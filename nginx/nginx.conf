# Front door for `docker compose up --scale crm-api=2`.
# REST is round-robin-safe (stateless); Socket.IO long-polling needs stickiness, so ip_hash pins a
# client to one instance. Clients that use transports: ['websocket'] need no stickiness at all.
# Cross-instance delivery (a message sent on #1 reaching a socket on #2) is the Redis adapter's job.
worker_processes auto;
events { worker_connections 2048; }

http {
  log_format json escape=json '{"time":"$time_iso8601","req_id":"$http_x_request_id","status":$status,"method":"$request_method","uri":"$uri","upstream":"$upstream_addr","rt":$request_time}';
  access_log /dev/stdout json;

  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  upstream crm_api {
    ip_hash;
    # Docker DNS returns every replica; nginx resolves at start-up, so `docker compose restart nginx`
    # after changing the scale.
    server crm-api:4001 max_fails=3 fail_timeout=10s;
    keepalive 32;
  }

  upstream auth_server {
    server auth-server:4000;
    keepalive 16;
  }

  server {
    listen 8080;
    client_max_body_size 1m;

    location /socket.io/ {
      proxy_pass http://crm_api;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 75s;
    }

    location / {
      proxy_pass http://crm_api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_buffering off; # stream the xlsx export
      proxy_read_timeout 120s;
    }
  }

  server {
    listen 8081;
    location / {
      proxy_pass http://auth_server;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
