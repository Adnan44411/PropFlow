# Local stack.  Secrets come from ./.env (copy .env.example, then `npm run keys:generate >> .env`).
#   docker compose up -d --build                      # everything
#   docker compose run --rm seed-auth && docker compose run --rm seed-crm   # logins + 10k demo properties
#   docker compose up -d --scale crm-api=2            # two crm-api instances behind nginx
name: propflow

x-node-common: &node-common
  restart: unless-stopped
  stop_grace_period: 12s
  logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set in .env}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?set in .env}
      CRM_DB_PASSWORD: ${CRM_DB_PASSWORD:?set in .env}
    command: ["--default-time-zone=+00:00", "--max-connections=300"]
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
    ports: ["3306:3306"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", ""]
    volumes: [redis-data:/data]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ── auth-server ──
  auth-migrate:
    build: { context: ., dockerfile: apps/auth-server/Dockerfile }
    image: propflow/auth-server:local
    command: ["node", "dist/src/scripts/migrate.js", "up"]
    environment: &auth-env
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: mysql://auth:${AUTH_DB_PASSWORD}@mysql:3306/auth_db
      REDIS_URL: redis://redis:6379
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:?run npm run keys:generate}
      KEY_ENCRYPTION_KEY: ${KEY_ENCRYPTION_KEY:?run npm run keys:generate}
      ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-60}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:5173}
      WEB_URL: ${WEB_URL:-http://localhost:5173}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
      SEED_PASSWORD: ${SEED_PASSWORD:-PropFlow@123}
    depends_on: { mysql: { condition: service_healthy } }
    restart: "no"

  auth-server:
    <<: *node-common
    image: propflow/auth-server:local
    environment: *auth-env
    ports: ["4000:4000"]
    depends_on:
      auth-migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  # ── crm-api (scalable: no host port; reach it through nginx on :8080) ──
  crm-migrate:
    build: { context: ., dockerfile: apps/crm-api/Dockerfile }
    image: propflow/crm-api:local
    command: ["node", "dist/src/scripts/migrate.js", "up"]
    environment: &crm-env
      NODE_ENV: production
      PORT: 4001
      DATABASE_URL: mysql://crm:${CRM_DB_PASSWORD}@mysql:3306/crm_db
      REDIS_URL: redis://redis:6379
      AUTH_SERVER_URL: http://auth-server:4000
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:5173}
      CRON_TZ: Asia/Kolkata
    depends_on: { mysql: { condition: service_healthy } }
    restart: "no"

  crm-api:
    <<: *node-common
    image: propflow/crm-api:local
    environment: *crm-env
    expose: ["4001"]
    depends_on:
      crm-migrate: { condition: service_completed_successfully }
      auth-server: { condition: service_healthy }
      redis: { condition: service_healthy }

  nginx:
    image: nginx:1.27-alpine
    volumes: [./nginx/nginx.conf:/etc/nginx/nginx.conf:ro]
    ports: ["8080:8080", "8081:8081"]
    depends_on: { crm-api: { condition: service_healthy } }
    restart: unless-stopped

  # ── one-shot seed (auth + crm). DESTRUCTIVE for crm_db. ──
  seed-auth:
    image: propflow/auth-server:local
    profiles: ["tools"]
    command: ["node", "dist/seeders/seed.js"]
    environment: *auth-env
    depends_on: { auth-migrate: { condition: service_completed_successfully } }

  seed-crm:
    image: propflow/crm-api:local
    profiles: ["tools"]
    command: ["node", "dist/seeders/seed.js"]
    environment: *crm-env
    depends_on: { crm-migrate: { condition: service_completed_successfully } }

volumes:
  mysql-data:
  redis-data:
